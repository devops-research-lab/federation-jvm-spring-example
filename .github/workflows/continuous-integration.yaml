name: Continuous Integration
on:
  push: null
jobs:
  build-products:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Validate Gradle wrapper
      uses: gradle/wrapper-validation-action@v1
    - name: Set up Java 17
      uses: actions/setup-java@v3
      with:
        java-version: 17
        distribution: zulu
    - name: Set up Gradle cache
      uses: gradle/gradle-build-action@v2
    - name: Build products subgraph with Gradle
      run: ./gradlew :products-subgraph:clean :products-subgraph:build :products-subgraph:bootJar
    - name: Upload JAR
      uses: actions/upload-artifact@v3
      with:
        name: products.jar
        path: ./products-subgraph/build/libs/products.jar
        retention-days: 1
  build-reviews:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Validate Gradle wrapper
      uses: gradle/wrapper-validation-action@v1
    - name: Set up Java 17
      uses: actions/setup-java@v3
      with:
        java-version: 17
        distribution: zulu
    - name: Set up Gradle cache
      uses: gradle/gradle-build-action@v2
    - name: Build reviews subgraph with Gradle
      run: ./gradlew :reviews-subgraph:clean :reviews-subgraph:build :reviews-subgraph:bootJar
    - name: Upload JAR
      uses: actions/upload-artifact@v3
      with:
        name: reviews.jar
        path: ./reviews-subgraph/build/libs/reviews.jar
        retention-days: 1
  build-supergraph:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup rover CLI
      run: 'curl -sSL https://rover.apollo.dev/nix/latest | sh -s -- --elv2-license accept

        echo "$HOME/.rover/bin" >> ${GITHUB_PATH}

        '
    - name: Compose Supergraph
      run: APOLLO_ELV2_LICENSE=accept rover supergraph compose --config supergraph.yaml > supergraph.graphql
    - name: Upload Supergraph config
      uses: actions/upload-artifact@v3
      with:
        name: supergraph.graphql
        path: supergraph.graphql
        retention-days: 1
  federation-test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs:
    - build-products
    - build-reviews
    - build-supergraph
    steps:
    - uses: actions/checkout@v3
    - name: Download products JAR
      uses: actions/download-artifact@v3
      with:
        name: products.jar
    - name: Download reviews JAR
      uses: actions/download-artifact@v3
      with:
        name: reviews.jar
    - name: Download Supergraph config
      uses: actions/download-artifact@v3
      with:
        name: supergraph.graphql
    - name: Start up Supergraph
      run: docker compose up --build --detach --wait
    - name: Federation Tests
      run: "set -x\necho \"verify router is up\"\ncurl --verbose http://localhost:8088/health\n\necho\
        \ \"sending a test query\"\ncurl --request POST \\\n  --verbose \\\n  --header 'content-type:\
        \ application/json' \\\n  --url http://localhost:3000/ \\\n  --data '{\"query\":\"query($productId:\
        \ ID!) {\\n  product(id: $productId) {\\n    id\\n    reviews {\\n      id\\n      text\\n   \
        \   starRating\\n    }\\n    name\\n    description\\n  }\\n}\",\"variables\":{\"productId\":\"\
        5\"}}' \\\n  > response.json\n\necho \"received GraphQL response\"\ncat response.json\n\necho\
        \ \"verifying response\"\njq -e '.data.product?.id == \"5\" and .data.product?.name == \"Dragon\"\
        \ and (.data.product?.reviews | length == 2) and (.data.product?.reviews[0]?.text | length > 0)'\
        \ response.json\n"
    - name: Error Logs
      if: ${{ failure() }}
      run: docker-compose logs
    - name: Stop Supergraph
      if: ${{ always() }}
      run: docker compose down --remove-orphans
