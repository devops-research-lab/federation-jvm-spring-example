name: Continuous Integration
on:
  push: null
jobs:
  build-products:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - name: stepify-probe-build-products
      run: echo stepify-probe-build-products
      id: _prv_federation_test
    - name: stepify-fault-build-products
      run: exit 1
      id: _prv_federation_test_1
    - uses: actions/checkout@v3
      id: _prv_federation_test_2
    - name: Validate Gradle wrapper
      uses: gradle/wrapper-validation-action@v1
      id: _prv_federation_test_3
    - name: Set up Java 17
      uses: actions/setup-java@v3
      with:
        java-version: 17
        distribution: zulu
      id: _prv_federation_test_4
    - name: Set up Gradle cache
      uses: gradle/gradle-build-action@v2
      id: _prv_federation_test_5
    - name: Build products subgraph with Gradle
      run: ./gradlew :products-subgraph:clean :products-subgraph:build :products-subgraph:bootJar
      id: _prv_federation_test_6
    - name: stepify-tail-build-products
      run: echo stepify-tail-build-products
      id: _prv_federation_test_7
    - name: stepify-probe-build-reviews
      run: echo stepify-probe-build-reviews
      if: '!cancelled()'
      id: _m_build_reviews
    - name: Validate Gradle wrapper
      uses: gradle/wrapper-validation-action@v1
      if: '!cancelled() && steps._m_build_reviews.conclusion != ''failure'''
      id: _m_build_reviews_1
    - name: Set up Gradle cache
      uses: gradle/gradle-build-action@v2
      if: '!cancelled() && steps._m_build_reviews.conclusion != ''failure'' && steps._m_build_reviews_1.conclusion
        != ''failure'''
      id: _m_build_reviews_2
    - name: Build reviews subgraph with Gradle
      run: ./gradlew :reviews-subgraph:clean :reviews-subgraph:build :reviews-subgraph:bootJar
      if: '!cancelled() && steps._m_build_reviews.conclusion != ''failure'' && steps._m_build_reviews_1.conclusion
        != ''failure'' && steps._m_build_reviews_2.conclusion != ''failure'''
      id: _m_build_reviews_3
    - name: stepify-tail-build-reviews
      run: echo stepify-tail-build-reviews
      if: '!cancelled() && steps._m_build_reviews.conclusion != ''failure'' && steps._m_build_reviews_1.conclusion
        != ''failure'' && steps._m_build_reviews_2.conclusion != ''failure'' && steps._m_build_reviews_3.conclusion
        != ''failure'''
      id: _prv_federation_test_8
    - name: stepify-probe-build-supergraph
      run: echo stepify-probe-build-supergraph
      if: '!cancelled()'
      id: _m_build_supergraph
    - name: Setup rover CLI
      run: 'curl -sSL https://rover.apollo.dev/nix/latest | sh -s -- --elv2-license accept

        echo "$HOME/.rover/bin" >> ${GITHUB_PATH}

        '
      if: '!cancelled() && steps._m_build_supergraph.conclusion != ''failure'''
      id: _m_build_supergraph_1
    - name: Compose Supergraph
      run: APOLLO_ELV2_LICENSE=accept rover supergraph compose --config supergraph.yaml > supergraph.graphql
      if: '!cancelled() && steps._m_build_supergraph.conclusion != ''failure'' && steps._m_build_supergraph_1.conclusion
        != ''failure'''
      id: _m_build_supergraph_2
    - name: stepify-tail-build-supergraph
      run: echo stepify-tail-build-supergraph
      if: '!cancelled() && steps._m_build_supergraph.conclusion != ''failure'' && steps._m_build_supergraph_1.conclusion
        != ''failure'' && steps._m_build_supergraph_2.conclusion != ''failure'''
      id: _prv_federation_test_9
    - name: stepify-probe-federation-test
      run: echo stepify-probe-federation-test
      id: _m_federation_test
    - name: Start up Supergraph
      run: docker compose up --build --detach --wait
      id: _m_federation_test_1
    - name: Federation Tests
      run: "set -x\necho \"verify router is up\"\ncurl --verbose http://localhost:8088/health\n\necho\
        \ \"sending a test query\"\ncurl --request POST \\\n  --verbose \\\n  --header 'content-type:\
        \ application/json' \\\n  --url http://localhost:3000/ \\\n  --data '{\"query\":\"query($productId:\
        \ ID!) {\\n  product(id: $productId) {\\n    id\\n    reviews {\\n      id\\n      text\\n   \
        \   starRating\\n    }\\n    name\\n    description\\n  }\\n}\",\"variables\":{\"productId\":\"\
        5\"}}' \\\n  > response.json\n\necho \"received GraphQL response\"\ncat response.json\n\necho\
        \ \"verifying response\"\njq -e '.data.product?.id == \"5\" and .data.product?.name == \"Dragon\"\
        \ and (.data.product?.reviews | length == 2) and (.data.product?.reviews[0]?.text | length > 0)'\
        \ response.json\n"
      id: _m_federation_test_2
    - name: Error Logs
      if: '!cancelled() && steps._prv_federation_test.conclusion != ''failure'' && steps._prv_federation_test_1.conclusion
        != ''failure'' && steps._prv_federation_test_2.conclusion != ''failure'' && steps._prv_federation_test_3.conclusion
        != ''failure'' && steps._prv_federation_test_4.conclusion != ''failure'' && steps._prv_federation_test_5.conclusion
        != ''failure'' && steps._prv_federation_test_6.conclusion != ''failure'' && steps._prv_federation_test_7.conclusion
        != ''failure'' && steps._m_build_reviews.conclusion != ''failure'' && steps._m_build_reviews_1.conclusion
        != ''failure'' && steps._m_build_reviews_2.conclusion != ''failure'' && steps._m_build_reviews_3.conclusion
        != ''failure'' && steps._prv_federation_test_8.conclusion != ''failure'' && steps._m_build_supergraph.conclusion
        != ''failure'' && steps._m_build_supergraph_1.conclusion != ''failure'' && steps._m_build_supergraph_2.conclusion
        != ''failure'' && steps._prv_federation_test_9.conclusion != ''failure'' && ((steps._m_federation_test.conclusion
        == ''failure'' || steps._m_federation_test_1.conclusion == ''failure'' || steps._m_federation_test_2.conclusion
        == ''failure''))'
      run: docker-compose logs
      id: _m_federation_test_3
    - name: Stop Supergraph
      if: steps._prv_federation_test.conclusion != 'failure' && steps._prv_federation_test_1.conclusion
        != 'failure' && steps._prv_federation_test_2.conclusion != 'failure' && steps._prv_federation_test_3.conclusion
        != 'failure' && steps._prv_federation_test_4.conclusion != 'failure' && steps._prv_federation_test_5.conclusion
        != 'failure' && steps._prv_federation_test_6.conclusion != 'failure' && steps._prv_federation_test_7.conclusion
        != 'failure' && steps._m_build_reviews.conclusion != 'failure' && steps._m_build_reviews_1.conclusion
        != 'failure' && steps._m_build_reviews_2.conclusion != 'failure' && steps._m_build_reviews_3.conclusion
        != 'failure' && steps._prv_federation_test_8.conclusion != 'failure' && steps._m_build_supergraph.conclusion
        != 'failure' && steps._m_build_supergraph_1.conclusion != 'failure' && steps._m_build_supergraph_2.conclusion
        != 'failure' && steps._prv_federation_test_9.conclusion != 'failure' && (always())
      run: docker compose down --remove-orphans
    - name: stepify-tail-federation-test
      run: echo stepify-tail-federation-test
